[project]
name = "llm-sentiment-analysis"
version = "0.1.0"
description = "LLM Sentiment Analysis"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langfuse>=3.14.4",
    "openai>=2.21.0",
    "pandas>=3.0.1",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.5",
    "tenacity>=9.1.4",
    "tqdm>=4.67.3",
]

[dependency-groups]
test = [
    "pytest>=9.0.3",
]
dev = [
    "ipykernel>=7.2.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: tests that call external APIs (e.g. OpenRouter)",
]
